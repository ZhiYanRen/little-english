<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#1f635b" />
    <meta
      name="description"
      content="剑桥国际少儿英语第二版第2级，12单元官方资源导航与本机词句、音频学习伴侣。"
    />
    <title>英语小星球 · 我的英语课本</title>
    <link rel="icon" type="image/png" href="./assets/favicon.png" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip" href="#main">跳到学习内容</a>
    <aside class="sidebar">
      <a class="brand" href="#/book"
        ><img src="./assets/logo.svg" width="44" height="44" alt="" /><span
          >英语小星球<small>LITTLE ENGLISH</small></span
        ></a
      >
      <div class="side-label">我的学习空间</div>
      <nav id="navigation" aria-label="主要导航"></nav>
      <div class="side-bottom">
        <div class="tiny-book">2</div>
        <strong>一本课本，一点点进步</strong>
        <p>第二版 · 第 2 级<br />12 个单元，慢慢学。</p>
        <a
          class="text-link"
          href="https://kb.unischool.cn/"
          target="_blank"
          rel="noopener noreferrer"
          >出版社资源中心 ↗</a
        >
      </div>
    </aside>
    <div class="app">
      <header class="topbar">
        <span class="mobile-brand"
          ><img
            src="./assets/logo.svg"
            alt=""
            width="30"
            height="30"
          />英语小星球</span
        ><span class="breadcrumb"
          >我的学习空间 <span>/</span> <span id="crumb">我的课本</span></span
        ><a class="top-materials" href="#/materials"
          ><span aria-hidden="true">＋</span> 学习资料</a
        >
      </header>
      <div id="storage-warning" class="notice warning" hidden></div>
      <main id="main" tabindex="-1"></main>
      <section
        id="player-panel"
        class="player-panel"
        aria-label="本机录音播放器"
        hidden
      >
        <div class="player-heading">
          <strong id="player-name"></strong
          ><button
            id="stop-player"
            disabled
            data-action="stop-player"
            class="icon-button"
            aria-label="关闭播放器"
          >
            ×
          </button>
        </div>
        <audio id="audio-player" controls preload="metadata"></audio>
        <div class="player-options">
          <label
            >播放速度
            <select id="speed">
              <option value="0.75">0.75 倍</option>
              <option value="1" selected>1 倍</option>
              <option value="1.25">1.25 倍</option>
            </select></label
          ><label><input id="loop-audio" type="checkbox" /> 循环此段</label
          ><span id="segment-label"></span>
        </div>
        <p id="player-error" class="field-error" role="status"></p>
      </section>
    </div>
    <div id="status" class="toast" role="status" aria-live="polite"></div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button
          class="icon-button"
          id="close-dialog"
          disabled
          data-action="close-dialog"
          aria-label="关闭弹窗"
        >
          ×
        </button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <input
      id="text-file"
      type="file"
      accept=".json,.tsv,application/json,text/tab-separated-values"
      hidden
    /><input
      id="audio-files"
      type="file"
      accept=".mp3,.m4a,.wav,.ogg,.webm,.aac,.flac,audio/*"
      multiple
      hidden
    />
    <script type="module" src="./app.js"></script>
  </body>
</html>
